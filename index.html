<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste API Abler com Address Formatado</title>
</head>
<body>
  <h2>Resposta da API</h2>
  <pre id="output">Carregando...</pre>

  <script>
    const TOKEN = "REDACTED_TOKEN";

    fetch("https://api.abler.com.br/v1/vacancies?released=true&status=published&include=responsible,level_of_interest,area_of_interests,address", {
      headers: {
        "Authorization": `Bearer ${TOKEN}`,
        "Content-Type": "application/json"
      }
    })
    .then(res => res.json())
    .then(json => {
      const includedMap = new Map();
      json.included?.forEach(item => {
        includedMap.set(`${item.type}-${item.id}`, item.attributes);
      });

      const enriched = json.data.map(item => {
        const relationships = item.relationships;
        const enrichedRels = {};

        let cityAndState = null;

        for (const [key, rel] of Object.entries(relationships)) {
          if (!rel?.data) continue;

          if (Array.isArray(rel.data)) {
            enrichedRels[key] = rel.data.map(d => ({
              id: d.id,
              type: d.type,
              attributes: includedMap.get(`${d.type}-${d.id}`) || {}
            }));
          } else {
            const d = rel.data;
            const attributes = includedMap.get(`${d.type}-${d.id}`) || {};

            // Se for address, extraímos o city_name + "-" + state_abbreviation
            if (d.type === "address") {
              const city = attributes.city_name || "";
              const state = attributes.state_abbreviation || "";
              cityAndState = `${city}-${state}`;
            }

            enrichedRels[key] = {
              id: d.id,
              type: d.type,
              attributes: attributes
            };
          }
        }

        return {
          id: item.id,
          title: item.attributes?.title,
          contracting_regime: item.attributes?.contracting_regime || null,
          city_and_state: cityAndState,
          attributes: item.attributes,
          relationships: enrichedRels
        };
      });

      document.getElementById("output").textContent = JSON.stringify(enriched, null, 2);

      // Baixar como JSON
      const blob = new Blob([JSON.stringify(enriched, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "abler-vacancies.json";
      link.click();
    })
    .catch(error => {
      document.getElementById("output").textContent = "Erro ao buscar dados:\n" + error;
    });
  </script>
</body>
</html>
